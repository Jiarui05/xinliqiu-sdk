# @file compose.cloud.yaml
# 目的：声明云端 API 的构建、资源限制和持久卷。
# 职责与入口：服务生命周期 → api；数据保留 → transcripts 卷。
# 边界：更新应用不重建已有数据卷，不挂载本机录音。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    environment:
      XQ_HOST: 0.0.0.0
      XQ_DATA_DIR: /data
      XQ_WORKER_CONCURRENCY: 1
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - transcripts:/data
    networks:
      - dokploy-network
volumes:
  transcripts:
    name: xinliqiu-cloud-transcripts
networks:
  dokploy-network:
    external: true
